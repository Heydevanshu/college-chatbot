<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload PDF</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .upload-container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e40af;
        }

        .success-message {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 20px;
        }

        .upload-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #2563eb;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .upload-btn:hover {
            background-color: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="upload-container">

        <h1>Upload PDF</h1>

        {% if success %}

            <div class="success-message">

                {{ success }}

            </div>

        {% endif %}

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="pdf_file"
                accept=".pdf"
                required
            >

            <button
                type="submit"
                class="upload-btn"
            >

                Upload PDF

            </button>

        </form>

    </div>

</body>

</html>
