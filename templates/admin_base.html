<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Admin" }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f4f7fb;
            color: #111827;
        }

        .navbar {
            background-color: #1e40af;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links a,
        .btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            padding: 9px 13px;
            text-decoration: none;
        }

        .nav-links a {
            background-color: white;
            color: #1e40af;
        }

        .page {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .page-header h2 {
            font-size: 24px;
        }

        .panel,
        .card {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
        }

        .panel {
            padding: 18px;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
        }

        .flash {
            border-radius: 8px;
            margin-bottom: 14px;
            padding: 12px 14px;
        }

        .flash.success {
            background-color: #dcfce7;
            color: #166534;
        }

        .flash.error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border-bottom: 1px solid #e5e7eb;
            padding: 11px;
            text-align: left;
            vertical-align: top;
            font-size: 14px;
        }

        th {
            background-color: #f9fafb;
            color: #374151;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            padding: 11px;
            width: 100%;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .muted {
            color: #6b7280;
        }

        .detail-list {
            display: grid;
            gap: 12px;
        }

        .detail-row {
            border-bottom: 1px solid #e5e7eb;
            display: grid;
            gap: 6px;
            padding-bottom: 12px;
        }

        .detail-row strong {
            color: #374151;
        }

        @media (max-width: 640px) {
            .page {
                padding: 16px;
            }

            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <h1>College Chatbot Admin</h1>

        <div class="nav-links">
            <a href="{{ url_for('admin.admin_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin.manage_notices') }}">Notices</a>
            <a href="{{ url_for('admin.manage_faculty') }}">Faculty</a>
            <a href="{{ url_for('admin.manage_exams') }}">Exams</a>
            <a href="{{ url_for('admin.uploaded_pdfs') }}">PDFs</a>
            <a href="{{ url_for('admin.admin_logout') }}">Logout</a>
        </div>
    </div>

    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
